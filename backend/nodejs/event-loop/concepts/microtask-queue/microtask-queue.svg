<svg viewBox="0 0 560 580" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .label  { fill: #8b949e; font-size: 11px; }
      .code   { fill: #79c0ff; font-size: 11px; }
      .desc   { fill: #8b949e; font-size: 10.5px; }

      /* Priority flash on microtask queue */
      @keyframes microFlash {
        0%,100% { stroke: #d2a8ff; }
        50%      { stroke: #f778ba; box-shadow: 0 0 8px #f778ba; }
      }
      .micro-box { animation: microFlash 1.5s ease-in-out infinite; }

      /* Microtask drains first */
      @keyframes microDrain {
        0%   { opacity: 1; transform: translateX(0); }
        30%  { opacity: 1; transform: translateX(160px) translateY(-80px); }
        60%  { opacity: 0; transform: translateX(160px) translateY(-80px); }
        100% { opacity: 0; }
      }
      .micro-cb1 { animation: microDrain 6s 1s infinite; }
      .micro-cb2 { animation: microDrain 6s 2s infinite; }

      /* Macro task waits */
      @keyframes macroWait {
        0%,55% { opacity: 0.3; }
        60%    { opacity: 1; }
        100%   { opacity: 1; }
      }
      .macro-cb { animation: macroWait 6s 1s infinite; }

      /* Priority badge pulse */
      @keyframes badgePulse {
        0%,100% { fill: #3a1040; }
        50%      { fill: #6e2080; }
      }
      .badge { animation: badgePulse 1.5s infinite; }
    </style>
    <marker id="arr-p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d2a8ff"/>
    </marker>
    <marker id="arr-o" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ffa657"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
  </defs>

  <rect width="560" height="580" class="bg"/>

  <!-- Title -->
  <text x="20" y="35" fill="#e6edf3" font-size="16px" font-weight="bold">⚡ Microtask Queue vs Callback Queue</text>
  <text x="20" y="52" class="label">Why Promises run before setTimeout</text>

  <!-- Priority ladder -->
  <rect x="20" y="68" width="160" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="30" y="88" fill="#e6edf3" font-size="11px" font-weight="bold">Priority Order</text>
  <text x="30" y="108" fill="#f78166" font-size="11px">① Call Stack runs</text>
  <text x="30" y="126" fill="#d2a8ff" font-size="11px">② Microtask Queue</text>
  <text x="30" y="142" fill="#8b949e" font-size="10px">   (ALL drained first)</text>
  <text x="30" y="162" fill="#ffa657" font-size="11px">③ Callback Queue</text>
  <text x="30" y="178" fill="#8b949e" font-size="10px">   (one per loop tick)</text>

  <!-- Code example -->
  <rect x="200" y="68" width="340" height="130" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="212" y="88" class="label">// execution order demo</text>
  <text x="212" y="106" class="code">console.log("A");             // 1st</text>
  <text x="212" y="122" class="code">setTimeout(() => log("B"),0); // 4th</text>
  <text x="212" y="138" class="code">Promise.resolve()             </text>
  <text x="212" y="154" class="code">  .then(() => log("C"))       // 2nd</text>
  <text x="212" y="170" class="code">  .then(() => log("D"));      // 3rd</text>
  <text x="212" y="190" class="label">Output: A → C → D → B</text>

  <!-- === MICROTASK QUEUE === -->
  <rect x="20" y="220" width="240" height="100" rx="6" fill="#1a0a2a" class="micro-box" stroke="#d2a8ff" stroke-width="1.8"/>
  <text x="32" y="240" fill="#d2a8ff" font-size="12px" font-weight="bold">⚡ Microtask Queue</text>
  <rect x="30" y="246" width="120" height="26" rx="4" fill="#3a1040" stroke="#d2a8ff" stroke-width="1" class="badge"/>
  <text x="40" y="264" fill="#d2a8ff" font-size="10px">PRIORITY: HIGH</text>
  <text x="32" y="290" class="label">Promises · queueMicrotask · MutationObserver</text>
  <text x="32" y="308" fill="#d2a8ff" font-size="10px">ALL microtasks drained before any macro task</text>

  <!-- microtask chip 1 -->
  <g class="micro-cb1">
    <rect x="32" y="318" width="100" height="24" rx="4" fill="#3a1040" stroke="#d2a8ff" stroke-width="1"/>
    <text x="42" y="335" fill="#d2a8ff" font-size="10px">.then(→ "C")</text>
  </g>
  <!-- microtask chip 2 -->
  <g class="micro-cb2">
    <rect x="140" y="318" width="100" height="24" rx="4" fill="#3a1040" stroke="#d2a8ff" stroke-width="1"/>
    <text x="150" y="335" fill="#d2a8ff" font-size="10px">.then(→ "D")</text>
  </g>

  <!-- === CALLBACK QUEUE === -->
  <rect x="20" y="360" width="240" height="80" rx="6" fill="#161b22" stroke="#ffa657" stroke-width="1.5"/>
  <text x="32" y="380" fill="#ffa657" font-size="12px" font-weight="bold">⏳ Callback Queue (Macro)</text>
  <text x="32" y="398" class="label">setTimeout · setInterval · I/O</text>
  <g class="macro-cb">
    <rect x="32" y="404" width="120" height="24" rx="4" fill="#3a2010" stroke="#ffa657" stroke-width="1"/>
    <text x="42" y="421" fill="#ffa657" font-size="10px">setTimeout(→ "B")</text>
  </g>

  <!-- === CALL STACK === -->
  <rect x="320" y="220" width="220" height="220" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="332" y="240" fill="#3fb950" font-size="12px" font-weight="bold">📚 Call Stack</text>
  <rect x="332" y="248" width="196" height="28" rx="4" fill="#1a3a2a" stroke="#3fb950" stroke-width="1"/>
  <text x="342" y="267" class="code" fill="#3fb950">console.log("C") ← runs</text>
  <rect x="332" y="282" width="196" height="28" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="342" y="301" class="label">Promise.then chain</text>
  <rect x="332" y="316" width="196" height="28" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="342" y="335" class="label">global script</text>

  <!-- arrows -->
  <line x1="262" y1="280" x2="318" y2="262" stroke="#d2a8ff" stroke-width="1.5" marker-end="url(#arr-p)"/>
  <text x="268" y="258" fill="#d2a8ff" font-size="10px">drain ALL</text>
  <line x1="262" y1="395" x2="318" y2="380" stroke="#ffa657" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arr-o)"/>
  <text x="267" y="373" fill="#ffa657" font-size="10px">only after</text>
  <text x="267" y="385" fill="#ffa657" font-size="10px">micro empty</text>

  <!-- Key insight -->
  <rect x="20" y="460" width="520" height="56" rx="6" fill="#161b22" stroke="#d2a8ff" stroke-width="1"/>
  <text x="30" y="479" fill="#d2a8ff" font-size="11px">💡 Key Insight</text>
  <text x="30" y="497" class="desc">After each task, the event loop drains the ENTIRE microtask queue before picking the next</text>
  <text x="30" y="513" class="desc">macro task. So a chain of .then()s all run before a single setTimeout callback.</text>

  <!-- Interview note -->
  <rect x="20" y="526" width="520" height="44" rx="6" fill="#161b22" stroke="#f78166" stroke-width="1"/>
  <text x="30" y="544" fill="#f78166" font-size="11px">🎯 Interview: "Promise.resolve().then() always runs before setTimeout(fn,0) — microtasks</text>
  <text x="30" y="560" fill="#f78166" font-size="11px">   have higher priority and fully drain before the event loop moves to the callback queue."</text>
</svg>
